services:
  - type: web
    name: swasthyacall-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_NAME
        value: swasthyacall
      - key: JWT_SECRET
        generateValue: true
      - key: GEMMA_API_BASE
        value: https://openrouter.ai/api/v1
      - key: GEMMA_MODEL_NAME
        value: google/gemma-2-9b-it
      - key: GEMMA_MODE
        value: online
      - key: MONGODB_URI
        sync: false
      - key: GEMMA_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_DEMO_MODE
        value: "false"
      - key: TWILIO_VERIFY_SIGNATURE
        value: "false"
      - key: PUBLIC_WEBHOOK_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
